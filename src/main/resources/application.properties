spring.application.name=${SPRING_APPLICATION_NAME}
server.port=${SERVER_PORT}

spring.profiles.active=${SPRING_PROFILES_ACTIVE}
spring.cloud.config.label=${SPRING_CLOUD_CONFIG_LABEL}
spring.config.import=optional:configserver:http://${CLOUDCONFIG_HOST}:${CLOUDCONFIG_PORT}
spring.cloud.config.username=${CLOUDCONFIG_USER}
spring.cloud.config.password=${CLOUDCONFIG_PASSWORD}

eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=http://${EUREKA_HOST}:${EUREKA_PORT}/eureka

management.endpoints.web.exposure.include=health,info,refresh,prometheus

spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.main.allow-bean-definition-overriding=true

analysis.feature-enabled=true
analysis.query.xml.location=classpath:queries/analysis-queries.xml
analysis.summary.default-pass-percentage=50.0
analysis.summary.exclude-qtypes=MOCKTEST,COMPETITION

logging.level.root=INFO
